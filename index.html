<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202124">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Что делать?</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 12px;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
.app{max-width:940px;margin:auto}h1{margin:0 0 5px;font-size:34px}.subtitle{margin:0 0 20px;color:#666}
.panel{background:#fff;padding:15px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.row,.filters,.buttons,.quick{display:flex;gap:8px;flex-wrap:wrap}
input,select,button,label{font:inherit}input,select{padding:11px;border:1px solid #ccc;border-radius:8px}
#taskInput,#search{flex:1;min-width:220px}button,.file{border:0;border-radius:8px;padding:10px 13px;background:#e9e9e9;cursor:pointer}
.primary,.active{background:#222!important;color:#fff}.quick{margin-top:9px}
.info{color:#666;font-size:14px;margin:12px 0}.section{font-weight:bold;color:#666;margin:20px 0 8px;text-transform:uppercase;font-size:13px}
.task{background:#fff;padding:15px;border-radius:12px;margin-bottom:8px;box-shadow:0 2px 6px #0001}
.task.overdue{border-left:5px solid #c62828;background:#fff5f5}.task.today{border-left:5px solid #1976d2}
.task.done .text{text-decoration:line-through;color:#888}.text{font-size:17px;font-weight:600}
.meta{font-size:13px;color:#777;margin-top:7px}.badge{font-size:12px;margin-left:7px;padding:3px 7px;border-radius:6px;background:#eee}
.high{background:#fff0d8}.urgent{background:#ffe0e0}.buttons{margin-top:12px}.file input{display:none}
.empty{text-align:center;background:#fff;padding:30px;border-radius:12px;color:#888}
@media(max-width:650px){body{padding:15px 8px}.row{flex-direction:column}#taskInput,#search{width:100%}}
</style>
</head>
<body>
<div class="app">
<h1>Что делать?</h1><p class="subtitle">PWA • версия 2.0</p>
<div class="panel">
<div class="row"><input id="taskInput" placeholder="Что нужно сделать?"><input id="taskDate" type="date">
<select id="priority"><option value="normal">Обычный</option><option value="high">Важный</option><option value="urgent">Срочный</option></select>
<button class="primary" onclick="addTask()">+ Добавить</button></div>
<div class="quick"><button onclick="quick('today')">Сегодня</button><button onclick="quick('tomorrow')">Завтра</button><button onclick="quick('none')">Без срока</button></div>
</div>
<div class="panel">
<div class="row"><input id="search" placeholder="Поиск по задачам..."></div>
<div class="buttons" style="margin-top:10px"><button onclick="exportData()">Экспорт</button><label class="file">Импорт<input id="importFile" type="file" accept=".json"></label></div>
</div>
<div class="filters">
<button id="all" onclick="filterTo('all')">Все</button><button id="today" onclick="filterTo('today')">Сегодня</button>
<button id="overdue" onclick="filterTo('overdue')">Просрочено</button><button id="future" onclick="filterTo('future')">Позже</button><button id="done" onclick="filterTo('done')">Выполненные</button>
</div>
<div id="info" class="info"></div><div id="list"></div>
</div>
<script>
const STORAGE="tasks";
let tasks=JSON.parse(localStorage.getItem(STORAGE)||"[]"),filter="all",query="";
const $=id=>document.getElementById(id);
function ds(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tomorrow(){let d=new Date();d.setDate(d.getDate()+1);return ds(d)}
function norm(t){return {text:String(t.text||""),done:!!t.done,date:t.date||"",priority:t.priority||"normal"}}
tasks=tasks.map(norm);
function save(){localStorage.setItem(STORAGE,JSON.stringify(tasks))}
function quick(x){$("taskDate").value=x==="today"?ds():x==="tomorrow"?tomorrow():""}
function addTask(){let text=$("taskInput").value.trim();if(!text)return;$("taskInput").value="";tasks.push({text,done:false,date:$("taskDate").value,priority:$("priority").value});$("taskDate").value="";$("priority").value="normal";save();render()}
function cat(t){if(t.done)return"done";if(t.date&&t.date<ds())return"overdue";if(t.date===ds())return"today";if(t.date>ds())return"future";return"nodate"}
function filterTo(x){filter=x;render()}
function toggle(i){tasks[i].done=!tasks[i].done;save();render()}
function postpone(i){tasks[i].date=tomorrow();tasks[i].done=false;save();render()}
function del(i){if(confirm("Удалить задачу «"+tasks[i].text+"»?")){tasks.splice(i,1);save();render()}}
function edit(i){let text=prompt("Измените задачу:",tasks[i].text);if(text===null)return;text=text.trim();if(!text)return;tasks[i].text=text;save();render()}
function visible(t){let c=cat(t);if(query&&!t.text.toLowerCase().includes(query))return false;if(filter==="all")return true;if(filter==="today")return c==="today"||c==="overdue";return c===filter}
function rank(t){let o={overdue:0,today:1,future:2,nodate:3,done:4},p={urgent:0,high:1,normal:2};return [o[cat(t)],p[t.priority]??2,t.date||"9999"]}
function render(){
 let list=$("list");list.innerHTML="";let arr=tasks.map((t,i)=>({t,i})).filter(x=>visible(x.t)).sort((a,b)=>{let A=rank(a.t),B=rank(b.t);return A[0]-B[0]||A[1]-B[1]||A[2].localeCompare(B[2])});
 if(!arr.length){list.innerHTML='<div class="empty">Задач здесь нет.</div>'}
 let last="";
 arr.forEach(({t,i})=>{let c=cat(t);if(filter==="all"&&c!==last){let h=document.createElement("div");h.className="section";h.textContent={overdue:"Просрочено",today:"Сегодня",future:"Позже",nodate:"Без срока",done:"Выполненные"}[c];list.appendChild(h);last=c}
 let el=document.createElement("div");el.className="task "+c;
 let tx=document.createElement("div");tx.className="text";tx.textContent=t.text;let b=document.createElement("span");b.className="badge "+t.priority;b.textContent=t.priority==="urgent"?"Срочный":t.priority==="high"?"Важный":"Обычный";tx.appendChild(b);el.appendChild(tx);
 if(t.date){let m=document.createElement("div");m.className="meta";m.textContent=(c==="overdue"?"Просрочено: ":c==="today"?"Сегодня: ":"Срок: ")+t.date.split("-").reverse().join(".");el.appendChild(m)}
 let bs=document.createElement("div");bs.className="buttons";
 [["✓ Выполнить",()=>toggle(i)],["→ На завтра",()=>postpone(i)],["Изменить",()=>edit(i)],["Удалить",()=>del(i)]].forEach(x=>{let z=document.createElement("button");z.textContent=t.done&&x[0][0]==="✓"?"↩ Вернуть":x[0];z.onclick=x[1];bs.appendChild(z)});el.appendChild(bs);list.appendChild(el)});
 $("info").textContent="Активных: "+tasks.filter(t=>!t.done).length+" • Просрочено: "+tasks.filter(t=>cat(t)==="overdue").length+" • Выполнено: "+tasks.filter(t=>t.done).length;
 document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b.id===filter));
}
function exportData(){let blob=new Blob([JSON.stringify({version:"2.0",tasks},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chto-delat-backup-"+ds()+".json";a.click();URL.revokeObjectURL(a.href)}
$("importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),a=Array.isArray(d)?d:d.tasks;if(!Array.isArray(a))throw 0;if(confirm("Заменить текущие задачи импортированными ("+a.length+")?")){tasks=a.map(norm);save();render()}}catch(_){alert("Не удалось прочитать резервную копию.")}e.target.value=""};r.readAsText(f)};
$("search").oninput=e=>{query=e.target.value.trim().toLowerCase();render()};$("taskInput").onkeydown=e=>{if(e.key==="Enter")addTask()};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.error))}
render();
</script>
</body></html>
